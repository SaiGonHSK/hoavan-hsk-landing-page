services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: hoavan-saigonhsk:latest
    container_name: hoavan-saigonhsk
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
