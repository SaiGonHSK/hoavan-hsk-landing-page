server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    server_tokens off;

    # --- Nén ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # --- Header bảo mật cơ bản ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Asset có hash: cache vĩnh viễn ---
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Ảnh, font: cache dài ---
    location ~* \.(webp|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- HTML: luôn kiểm tra lại để deploy mới có hiệu lực ngay ---
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /sitemap-index.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt        { add_header Cache-Control "public, max-age=3600"; }

    # Astro build ra thư mục/index.html → thử cả hai dạng trước khi 404
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
